name: Bug report
description: Report a reproducible correctness, compatibility, or packaging problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please read the troubleshooting guide first. Do not include workplace data, credentials, or private paths.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0-dev or commit SHA"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows edition and build
      placeholder: "Windows 11 24H2, build ..."
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - x64
        - ARM64
        - Other
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: Reproduction steps
      description: Include the smallest sequence that shows the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Observed behavior and diagnostics
      description: Include relevant logs or test output, redacting private details.
    validations:
      required: true
  - type: checkboxes
    id: policy
    attributes:
      label: Before submitting
      options:
        - label: I have removed credentials, private work data, and sensitive managed-device details.
          required: true
        - label: I have checked the troubleshooting guide and searched existing issues.
          required: true
