name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64, x86]

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build/${{ matrix.arch }}
          -G "Visual Studio 17 2022"
          -A ${{ matrix.arch }}
          -DIDLEHARBOR_BUILD_TESTS=ON

      - name: Build Release
        run: cmake --build build/${{ matrix.arch }} --config Release --parallel

      - name: Run tests
        if: matrix.arch != 'arm64'
        run: ctest --test-dir build/${{ matrix.arch }} -C Release --output-on-failure

      - name: Validate PowerShell packaging scripts
        shell: pwsh
        run: .\packaging\Test-Packaging.ps1
