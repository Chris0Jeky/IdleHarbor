name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: x64
          - arch: arm64
            platform: ARM64
          - arch: x86
            platform: Win32

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build/${{ matrix.arch }}
          -G "Visual Studio 17 2022"
          -A ${{ matrix.platform }}
          -DIDLEHARBOR_BUILD_TESTS=ON

      - name: Build Release
        run: cmake --build build/${{ matrix.arch }} --config Release --parallel

      - name: Run tests
        if: matrix.arch != 'arm64'
        run: ctest --test-dir build/${{ matrix.arch }} -C Release --output-on-failure

      - name: Validate PowerShell packaging scripts
        shell: pwsh
        run: .\packaging\Test-Packaging.ps1

      - name: Check the website's Pulseboard SDK install
        if: matrix.arch == 'x64'
        run: node observatory/check.mjs

  script-regressions:
    name: Script regressions (${{ matrix.shell }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run registered script regressions
        shell: ${{ matrix.shell }}
        run: .\tests\Test-RegressionScripts.ps1

      - name: Validate packaging in this PowerShell edition
        shell: ${{ matrix.shell }}
        run: .\packaging\Test-Packaging.ps1
