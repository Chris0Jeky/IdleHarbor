name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.arch }}
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: x64
          - arch: arm64
            platform: ARM64

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tag is not a supported stable release version: $version" }
          .\packaging\Test-ReleaseVersion.ps1 -Tag '${{ github.ref_name }}'
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build/${{ matrix.arch }}
          -G "Visual Studio 17 2022"
          -A ${{ matrix.platform }}
          -DIDLEHARBOR_BUILD_TESTS=ON

      - name: Build Release
        run: cmake --build build/${{ matrix.arch }} --config Release --parallel

      - name: Run tests
        if: matrix.arch == 'x64'
        run: ctest --test-dir build/${{ matrix.arch }} -C Release --output-on-failure

      - name: Package portable archive and SBOM
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          .\packaging\New-ReleasePackage.ps1 `
            -BuildDirectory build/${{ matrix.arch }}/Release `
            -OutputDirectory dist `
            -Version '${{ steps.version.outputs.version }}' `
            -Architecture '${{ matrix.arch }}' `
            -SourceRevision '${{ github.sha }}'
          .\packaging\New-Sbom.ps1 `
            -InputPath build/${{ matrix.arch }}/Release/IdleHarbor.exe `
            -OutputPath dist/IdleHarbor-${{ steps.version.outputs.version }}-windows-${{ matrix.arch }}.spdx.json `
            -Version '${{ steps.version.outputs.version }}' `
            -Architecture '${{ matrix.arch }}'
          .\packaging\Test-Packaging.ps1

      - name: Attest portable archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload architecture package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.arch }}
          path: dist
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: windows-2022
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out packaging scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require tracked licence
        shell: pwsh
        run: .\packaging\Test-ReleaseLicense.ps1 -RepositoryRoot .

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate release checksums
        shell: pwsh
        run: .\packaging\New-Checksums.ps1 -InputDirectory dist

      - name: Attest final release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath dist -File | ForEach-Object FullName)
          gh release create '${{ github.ref_name }}' --verify-tag --generate-notes $assets
